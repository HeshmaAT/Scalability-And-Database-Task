services:
  app1:
    environment:
      LAB4_EDGE_LAB: "true"
      LAB4_EDGE_URL: http://localhost:8084
  app2:
    environment:
      LAB4_EDGE_LAB: "true"
      LAB4_EDGE_URL: http://localhost:8084
  nginx:
    volumes:
      - ./docker/nginx/lab4-authorized-origin.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/lab4-auth.params:/etc/nginx/lab4-auth.params:ro
  edge-eu:
    volumes:
      - ./docker/lab4/edge/edge-authorized.conf:/etc/nginx/conf.d/default.conf:ro
  edge-asia:
    volumes:
      - ./docker/lab4/edge/edge-authorized.conf:/etc/nginx/conf.d/default.conf:ro
