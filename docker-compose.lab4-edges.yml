services:
  nginx:
    volumes:
      - ./docker/nginx/lab4-origin.conf:/etc/nginx/conf.d/default.conf:ro
  edge-eu:
    build: ./docker/lab4/edge
    image: url-shortener-lab4-edge
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - ./docker/lab4/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/lab4/edge/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/lab4/edge/edge.js:/etc/nginx/lab4-edge.js:ro
    depends_on:
      - nginx
    networks:
      default: {}
      lab1-dns:
        ipv4_address: 172.30.53.40
  edge-asia:
    image: url-shortener-lab4-edge
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      - ./docker/lab4/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/lab4/edge/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/lab4/edge/edge.js:/etc/nginx/lab4-edge.js:ro
    depends_on:
      - nginx
    networks:
      default: {}
      lab1-dns:
        ipv4_address: 172.30.53.41
