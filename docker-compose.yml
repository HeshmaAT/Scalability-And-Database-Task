services:
  app1:
    build: .
    image: url-shortener-app
    environment: &app-environment
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
      REDIS_QUEUE_HOST: redis-queue
      REDIS_QUEUE_PORT: "6379"
      REDIS_QUEUE_CONNECTION: queue
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    tmpfs: &laravel-tmpfs
      - /var/www/html/bootstrap/cache
      - /var/www/html/storage/framework

  app2:
    image: url-shortener-app
    environment: *app-environment
    tmpfs: *laravel-tmpfs

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app1
      - app2

  db-primary:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_REPLICATION_USER: ${MARIADB_REPLICATION_USER}
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD}
    command:
      - --server-id=1
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
    volumes:
      - primary-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-replica:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_MASTER_HOST: db-primary
      MARIADB_REPLICATION_USER: ${MARIADB_REPLICATION_USER}
      MARIADB_REPLICATION_PASSWORD: ${MARIADB_REPLICATION_PASSWORD}
    command:
      - --server-id=2
      - --log-bin=mariadb-bin
      - --relay-log=mariadb-relay-bin
      - --log-slave-updates=ON
      - --binlog-format=ROW
      - --gtid-strict-mode=ON
      - --read-only=ON
    volumes:
      - replica-data:/var/lib/mysql
      - ./docker/mariadb/replica-init.sql:/docker-entrypoint-initdb.d/10-replication.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis-cache:
    image: redis:7.4
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lfu
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      db-primary:
        condition: service_healthy

  redis-queue:
    image: redis:7.4
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - queue-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: url-shortener-app
    environment: *app-environment
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=1
      - --tries=3
      - --timeout=60
    restart: unless-stopped
    depends_on:
      redis-queue:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      db-primary:
        condition: service_healthy
    tmpfs: *laravel-tmpfs

  scheduler:
    image: url-shortener-app
    environment: *app-environment
    command: [ "php", "artisan", "schedule:work" ]
    restart: unless-stopped
    depends_on:
      redis-cache:
        condition: service_healthy
      db-primary:
        condition: service_healthy
    tmpfs: *laravel-tmpfs
  minio:
    build:
      context: ./docker/minio
    image: url-shortener-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    volumes:
      - minio-data:/data
volumes:
  primary-data:
  replica-data:
  queue-data:
  minio-data:
