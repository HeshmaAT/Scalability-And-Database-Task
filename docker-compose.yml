services:
  app:
    build: .
    image: url-shortener-app
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

  nginx:
    image: nginx:stable
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
