upstream lab6_app_a { server app1:9000; }
upstream lab6_app_b { server app2:9000; }
map $http_x_lab6_app $lab6_php_pool {
    default laravel;
    app1 lab6_app_a;
    app2 lab6_app_b;
}
upstream lab6_sockets {
    server reverb-1:8080;
    server reverb-2:8080;
}
log_format lab4_origin escape=json '{"probe":"$http_x_lab4_probe","path":"$uri","status":$status,"request_time":$request_time}';
upstream laravel {
    server app1:9000;
    server app2:9000;
}

server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 421 "Unknown host\n";
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    default_type text/plain;
    return 421 "Unknown host\n";
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name go.brand.test localhost 127.0.0.1;

    ssl_certificate /etc/nginx/lab2-tls/server.pem;
    ssl_certificate_key /etc/nginx/lab2-tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LAB2SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 65s;

    root /var/www/html/public;
    location = /api/lab4/qr-authorize { return 404; }


    # The /lab6 route must reach Laravel, even though public/lab6 holds assets.
    location ^~ /app/ {
        proxy_pass http://lab6_sockets;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        add_header X-Lab6-Socket-Node $upstream_addr always;
    }
    location = /lab6 {
        rewrite ^ /index.php last;
    }
    location = /lab6/ {
        return 302 $scheme://$http_host/lab6$is_args$args;
    }

    location ^~ /lab2-assets/ {
        alias /srv/lab2-assets/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include /etc/nginx/lab3-fastcgi-fixed.params;
        fastcgi_pass $lab6_php_pool;
        access_log /var/log/nginx/lab4-origin.log lab4_origin;
        add_header X-Lab4-Origin-Time $msec always;
        add_header X-Lab6-App $upstream_addr always;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Private, un-published listener for edge authorization subrequests.
server {
    listen 8081;
    server_name _;
    root /var/www/html/public;
    location = /api/lab4/qr-authorize {
        include /etc/nginx/lab4-auth.params;
        fastcgi_pass $lab6_php_pool;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        access_log /var/log/nginx/lab4-auth.log lab4_origin;
    }
    location / { return 404; }
}
