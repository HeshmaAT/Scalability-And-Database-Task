# Lab-only cache: only synthetic lab3mc_ links can be cached.
fastcgi_cache_path /var/cache/nginx/lab3-micro levels=1:2 keys_zone=LAB3MICRO:10m max_size=32m inactive=1m;
map $request_uri $lab3_skip_cache {
    default 1;
    ~^/lab3mc_[A-Za-z0-9]+$ 0;
}
map $upstream_cache_status $lab3_cache_status {
    "" BYPASS;
    default $upstream_cache_status;
}

upstream laravel {
    server app1:9000;
    server app2:9000;
}

server {
    listen 80 default_server;
    server_name _;
    default_type text/plain;
    return 421 "Unknown host\n";
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    default_type text/plain;
    return 421 "Unknown host\n";
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name go.brand.test localhost 127.0.0.1;

    ssl_certificate /etc/nginx/lab2-tls/server.pem;
    ssl_certificate_key /etc/nginx/lab2-tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LAB2SSL:10m;
    ssl_session_timeout 10m;
    keepalive_timeout 65s;

    root /var/www/html/public;

    location ^~ /lab2-assets/ {
        alias /srv/lab2-assets/;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        include /etc/nginx/lab3-fastcgi-fixed.params;
        fastcgi_pass laravel;
        fastcgi_cache off;
        fastcgi_cache_key "$scheme|$host|$request_uri";
        fastcgi_cache_methods GET HEAD;
        fastcgi_cache_valid 302 3s;
        fastcgi_cache_lock on;
        fastcgi_cache_lock_timeout 5s;
        fastcgi_cache_lock_age 5s;
        fastcgi_cache_bypass $lab3_skip_cache $http_authorization $http_cookie;
        fastcgi_no_cache $lab3_skip_cache $http_authorization $http_cookie;
        # Explicit LAB experiment: redirects normally return no-store.
        # Set-Cookie protection is retained; the map excludes all real link codes.
        fastcgi_ignore_headers Cache-Control Expires;
        add_header X-Lab3-Cache $lab3_cache_status always;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
