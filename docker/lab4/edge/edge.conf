js_import lab4 from /etc/nginx/lab4-edge.js;
fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
proxy_cache_path /var/cache/nginx/lab4 levels=1:2 keys_zone=LAB4QR:10m max_size=64m inactive=10m;
server {
    listen 80;
    server_name localhost 127.0.0.1;
    location = /_lab4_expiry {
        internal;
        js_content lab4.expiry;
    }
    location ~ ^/qr/[0-9]+$ {
        limit_except GET HEAD { deny all; }
        set $lab4_original_uri $request_uri;
        # Full URI includes the signature; only a previously validated exact
        # signed URL can HIT. Expiry is checked on EVERY request, including HITs.
        auth_request /_lab4_expiry;
        proxy_pass http://nginx:80;
        proxy_set_header Host localhost:8080;
        proxy_set_header X-Lab4-Probe $http_x_lab4_probe;
        proxy_cache LAB4QR;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_lock_age 30s;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_cache_bypass $http_authorization $http_cookie;
        proxy_no_cache $http_authorization $http_cookie;
        # Controlled lab override of origin's no-store for QR images ONLY.
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "private, max-age=0, must-revalidate" always;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Lab4-Collapsing on always;
        js_header_filter lab4.age;
    }
    location / { return 404; }
}
